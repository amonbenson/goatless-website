services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - PUBLIC_SERVER_URL=${PUBLIC_SERVER_URL:-http://localhost:8080}
    volumes:
      - frontend_dist:/app/dist

  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - PUBLIC_SERVER_URL=${PUBLIC_SERVER_URL:-http://localhost:8080}
    ports:
      - "5000:5000" # host:container
    environment:
      - PORT=5000

  nginx:
    restart: always
    image: nginx:stable-alpine-slim
    ports:
      - "${PORT}:80" # host:container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/var/www/html:ro
    depends_on:
      - frontend
      - backend

volumes:
  frontend_dist:
