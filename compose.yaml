services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/app/dist
    environment:
      - NODE_ENV=production
      - VITE_PUBLIC_SERVER=${PUBLIC_SERVER_URL}

  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000" # host:container
    environment:
      - PORT=5000
      - NODE_ENV=production
      - PUBLIC_SERVER=${PUBLIC_SERVER_URL}

  nginx:
    restart: always
    image: nginx:stable-alpine-slim
    ports:
      - "${PORT}:80" # host:container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/var/www/html:ro
    depends_on:
      - frontend
      - backend

volumes:
  frontend_dist:
