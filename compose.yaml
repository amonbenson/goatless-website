services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/app/dist

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000" # host:container
    environment:
      - PORT=5000

  nginx:
    image: nginx:stable-alpine-slim
    ports:
      - "8080:80" # host:container
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/var/www/html:ro
    depends_on:
      - frontend
      - backend

volumes:
  frontend_dist:
